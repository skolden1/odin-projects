<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container">
      <div class="showAnswer">0</div>

      <div class="buttons">
        <button>C</button>
        <button class="char">/</button>
        <button class="char">x</button>
        <button class="char">-</button>

        <button>7</button>
        <button>8</button>
        <button>9</button>
        <button class="char">+</button>

        <button>4</button>
        <button>5</button>
        <button>6</button>
        <button class="char">=</button>

        <button>1</button>
        <button>2</button>
        <button>3</button>
        <button class="char dot">.</button>

        <button class="zero">0</button>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
